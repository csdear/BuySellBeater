<mat-card class="vehicle-card">
  <mat-card-header>
    <mat-card-title>New Vehicle</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="loading" class="loading-row">
      <mat-progress-spinner mode="indeterminate" diameter="30"></mat-progress-spinner>
      <span>Loading makes…</span>
    </div>

    <div *ngIf="errorMessage" class="status error">{{ errorMessage }}</div>

    <form *ngIf="!loading && !errorMessage" class="vehicle-form">
      <mat-form-field appearance="outline">
        <mat-label>Make</mat-label>
        <mat-select
          [(ngModel)]="vehicle.make"
          name="make"
          (selectionChange)="onMakeChange()">
          <mat-option [value]="null">Select a make</mat-option>
          <mat-option *ngFor="let make of makes" [value]="make">{{ make.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Model</mat-label>
        <mat-select [(ngModel)]="vehicle.model" name="model">
          <mat-option [value]="null">Select a model</mat-option>
          <mat-option *ngFor="let model of vehicle.make?.models ?? []" [value]="model">{{ model.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-flat-button color="primary" type="button">Save Vehicle</button>
    </form>

    <div *ngIf="!loading && !errorMessage && !makes.length" class="status">
      No vehicle data available.
    </div>
  </mat-card-content>
</mat-card>
