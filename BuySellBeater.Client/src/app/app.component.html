<main class="main">
  <section class="content">
    <div>
      <h1>{{ title }}</h1>
      <p>Vehicle makes and models loaded from the BuySellBeater API.</p>
      <mat-toolbar color="primary">My App</mat-toolbar>

      <mat-card class="demo-card">
        <mat-card-header>
          <mat-card-title>Vehicle Inventory</mat-card-title>
          <mat-card-subtitle>Quick overview</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>This is a demo Material card showing the app is using Angular Material.</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-flat-button color="primary">View cars</button>
          <button mat-button>Learn more</button>
        </mat-card-actions>
      </mat-card>

      <vehicle-form></vehicle-form>
    </div>
  </section>
</main>
