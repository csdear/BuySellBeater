<main class="main">
  <section class="content">
    <div>
      <h1>{{ title }}</h1>
      <p>Vehicle makes and models loaded from the BuySellBeater API.</p>

      <div *ngIf="loading" class="status">Loading vehicles…</div>
      <div *ngIf="errorMessage" class="status error">{{ errorMessage }}</div>

      <ul *ngIf="!loading && !errorMessage && makes.length" class="make-list">
        <li *ngFor="let make of makes" class="make-item">
          <strong>{{ make.name }}</strong>
          <ul class="model-list">
            <li *ngFor="let model of make.models">{{ model.name }}</li>
          </ul>
        </li>
      </ul>

      <div *ngIf="!loading && !errorMessage && !makes.length" class="status">
        No vehicle data available.
      </div>
    </div>
  </section>
</main>
